name: Publish to NuGet

on:
  push:
    tags:
      # Trigger only on version tags like v1.0.0, v1.2.3-beta, etc.
      - 'v*.*.*'

jobs:
  publish:
    runs-on: windows-latest  # Required for net*-windows targets and WinForms

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for versioning/tags

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Extract version from tag
        id: get_version
        run: |
          # Remove leading 'v' from the tag (e.g. v1.0.0 -> 1.0.0)
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "Extracted version: $version"

      - name: Build (Release)
        run: dotnet build src/ModernTreeListView/ModernTreeListView.csproj -c Release --no-restore

      - name: Pack NuGet package (with symbols)
        run: >
          dotnet pack src/ModernTreeListView/ModernTreeListView.csproj
          -c Release
          --no-build
          --output ./artifacts
          /p:Version=${{ steps.get_version.outputs.version }}
          /p:PackageVersion=${{ steps.get_version.outputs.version }}
          /p:ContinuousIntegrationBuild=true

      - name: Publish to NuGet.org
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path ./artifacts -Filter *.nupkg)
          if ($packages.Count -eq 0) { throw "No .nupkg files were produced in ./artifacts." }
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key "${{ secrets.NUGET_API_KEY }}" `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
          }

      - name: Publish symbol package (snupkg)
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path ./artifacts -Filter *.snupkg -ErrorAction SilentlyContinue)
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName `
              --api-key "${{ secrets.NUGET_API_KEY }}" `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
          }
        continue-on-error: true
